[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "eko"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0,<4",
    "rich>=13,<15",
    "tinker-cookbook>=0.1,<1",
]

[project.scripts]
eko = "host:main"

[tool.setuptools]
py-modules = ["eko", "host", "tinker_model"]
